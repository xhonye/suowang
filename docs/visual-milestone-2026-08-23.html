<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUOWANG · 视觉阶段里程碑</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    body { margin: 0; color: #20343c; background: #eef4f5; }
    main { width: min(1240px, calc(100% - 44px)); margin: 0 auto; padding: 34px 0 60px; }
    h1 { margin: 0 0 7px; font-size: 27px; }
    p { margin: 0 0 24px; color: #6b7d84; }
    section { margin-top: 20px; padding: 18px; background: #fff; border: 1px solid rgba(47,83,96,.12); border-radius: 18px; box-shadow: 0 12px 28px rgba(32,68,80,.08); }
    h2 { margin: 0 0 11px; font-size: 15px; }
    .scene { position: relative; overflow: hidden; border-radius: 10px; background: #dce9ec; }
    .scene img { display: block; width: 100%; height: auto; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    figure { margin: 0; padding: 11px; background: #f7fbfb; border-radius: 12px; }
    figure img { display: block; width: 100%; aspect-ratio: 3 / 1; object-fit: contain; background: #0b1519; border-radius: 7px; }
    figcaption { margin-top: 7px; color: #64777e; font-size: 11px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>视觉阶段里程碑 · 2026-08-23</h1>
    <p>固定道路底图、结构线稿与独立箭头层，后续迭代以本页资产为基准。</p>
    <section><h2>1. 去箭头底图</h2><div class="scene"><img src="../assets/milestones/2026-08-23-arrow-pipeline/base-no-arrows-v1.png" alt="去箭头底图" /></div></section>
    <section><h2>2. 原始带白箭头底图</h2><div class="scene"><img src="../assets/milestones/2026-08-23-arrow-pipeline/base-with-white-arrows-v1.png" alt="带白箭头底图" /></div></section>
    <section><h2>3. 成功生图基座 · 山体候选 V2</h2><div class="scene"><img src="../assets/milestones/2026-08-23-arrow-pipeline/generation-base-selected-v2.png" alt="最终成功生图使用的有色结构基座" /></div></section>
    <section><h2>4. 独立箭头层</h2><div class="grid">
      <figure><img src="../assets/milestones/2026-08-23-arrow-pipeline/arrow-restore-light-v1.png" alt="恢复箭头层" /><figcaption>恢复</figcaption></figure>
      <figure><img src="../assets/milestones/2026-08-23-arrow-pipeline/arrow-work-light-v1.png" alt="工作箭头层" /><figcaption>工作</figcaption></figure>
      <figure><img src="../assets/milestones/2026-08-23-arrow-pipeline/arrow-life-light-v1.png" alt="生活箭头层" /><figcaption>生活</figcaption></figure>
    </div></section>
  </main>
</body>
</html>
