<!doctype html>
<html lang="zh-CN" data-workspace-density="medium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f6f5" />
    <meta name="description" content="所往 SUOWANG · A 版自适应桌面工作台隔离预览" />
    <title>所往 · A 版自适应桌面工作台</title>
    <link rel="icon" type="image/png" href="../assets/brand/favicon.png" />
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="desktop-adaptive-a-preview.css" />
  </head>
  <body class="adaptive-a-preview">
    <div class="app-shell">
      <aside class="side-rail" aria-label="SUOWANG 主导航">
        <a class="brand" href="#dashboard-page" aria-label="所往驾驶舱">
          <span class="brand-mark" aria-hidden="true">
            <img src="../assets/brand/suowang-scenic-mark-v1.png" alt="" />
          </span>
          <span class="brand-copy"><strong>所往</strong><small>SUOWANG</small></span>
        </a>

        <nav class="rail-nav" aria-label="主要页面">
          <button type="button" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4Z"/><path d="M9 20v-5h6v5"/></svg>
            <span>驾驶舱</span>
          </button>
          <button type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h6M8 17h4"/></svg>
            <span>行迹</span>
          </button>
          <button type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4M12 7h8M4 17h8M16 17h4"/><circle cx="10" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>
            <span>设置</span>
          </button>
        </nav>

        <div class="rail-profile">
          <span class="profile-avatar" aria-hidden="true">所</span>
          <span class="profile-copy"><strong>所往用户</strong></span>
        </div>
        <p class="brand-slogan">行有所往。</p>
      </aside>

      <div class="workspace-shell">
        <main class="page-stage">
          <section class="page dashboard-page" id="dashboard-page" aria-labelledby="dashboard-title">
            <section class="road-stage" data-active-state="work" aria-label="恢复、工作与生活三条道路">
              <div class="road-scene">
                <img class="road-image road-base" src="../assets/mainline-scene-bright-office-v1-no-arrows-geometry-v5.png" alt="明亮清晨中三条远端分离的道路" />
                <img class="road-image road-state road-arrow selected" src="../assets/mainline-scene-bright-office-v1-arrow-work-light-v4.png" alt="" />
              </div>

              <div class="road-chrome" aria-label="今日信息">
                <div class="greeting-block"><span class="daylight-icon" aria-hidden="true">🌙</span><strong>晚上好，所往用户</strong></div>
                <div class="road-context"><time>8月29日周六</time><span aria-hidden="true">·</span><span>充分参与这一次人生</span></div>
              </div>

              <div class="road-stage-copy">
                <div class="dashboard-heading">
                  <div>
                    <p class="eyebrow">MAINLINE COCKPIT</p>
                    <h1 id="dashboard-title">人生主线驾驶舱</h1>
                    <p class="dashboard-prompt">我现在处于什么模式？主要往哪里走？现在做什么？怎样更容易开始？</p>
                  </div>
                </div>
                <p class="state-cue">工作模式 · 只推进此刻最值得完成的一件事。</p>
              </div>

              <div class="route-tabs" role="tablist" aria-label="恢复、工作与生活模式">
                <button class="route-tab" type="button" role="tab" aria-selected="false">
                  <span class="route-tab-label"><span class="route-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18.4 4.8C12.3 4.9 7.6 7.6 6.1 12.2c-1 3.1.4 5.8 3.2 6.8 2.8 1 5.3-.5 6.6-3.4 1.2-2.8 1.3-6.3 2.5-10.8Z"/><path d="M6 20c1.7-4.4 4.8-7.4 9.4-9.1"/></svg></span><strong>恢复模式</strong><small>休息好，再出发</small></span>
                </button>
                <button class="route-tab" type="button" role="tab" aria-selected="true">
                  <span class="route-tab-label"><span class="route-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M4 12h16M10 12v2h4v-2"/></svg></span><strong>工作模式</strong><small>此刻所在</small></span>
                </button>
                <button class="route-tab" type="button" role="tab" aria-selected="false">
                  <span class="route-tab-label"><span class="route-tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 11 8-6 8 6v9H4Z"/><path d="M9 20v-5h6v5"/></svg></span><strong>生活模式</strong><small>安放重要的人与事</small></span>
                </button>
              </div>
              <span class="road-stage-fade" aria-hidden="true"></span>
            </section>

            <section class="mainline-deck" aria-label="三个主线槽">
              <h2 class="visually-hidden">主线</h2>
              <div class="mainline-slots">
                <article class="mainline-slot">
                  <button class="mainline-card" type="button">
                    <span class="mainline-name">完善桌面体验</span>
                    <span class="mainline-goal">让不同窗口尺寸都从容、稳定</span>
                    <span class="mainline-more" aria-label="主线菜单"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span>
                  </button>
                </article>
                <article class="mainline-slot">
                  <button class="mainline-card current" type="button">
                    <span class="mainline-state">当前主线</span>
                    <span class="mainline-name">发布首个公开测试版</span>
                    <span class="mainline-goal">让新用户能放心下载并开始使用</span>
                    <span class="mainline-more" aria-label="主线菜单"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span>
                  </button>
                </article>
                <article class="mainline-slot">
                  <button class="mainline-card" type="button">
                    <span class="mainline-name">记录真实使用反馈</span>
                    <span class="mainline-goal">只保留真正影响行动的改进</span>
                    <span class="mainline-more" aria-label="主线菜单"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span>
                  </button>
                </article>
              </div>
            </section>

            <section class="cockpit" aria-label="当前主线工作舱">
              <section class="current-detail" aria-label="当前主线详情">
                <button class="detail-field" type="button"><small>主线名称</small><span>发布首个公开测试版</span></button>
                <button class="detail-field" type="button"><small>主线目标</small><span>让新用户能放心下载并开始使用</span></button>
                <button class="detail-field" type="button"><small>本阶段完成标准</small><span>完成安装验证并收集首轮反馈</span></button>
                <button class="detail-field" type="button"><small>本阶段时间范围</small><span>约 2 周</span></button>
              </section>

              <div class="work-area">
                <section class="priority-zone" aria-labelledby="priority-heading">
                  <div class="priority-label"><h2 id="priority-heading">下一步</h2><button class="stuck-toggle" type="button">卡住了？</button></div>
                  <div class="priority-content">
                    <article class="priority-card">
                      <div class="priority-copy">
                        <small>正在走这一步</small>
                        <button class="priority-title" type="button">确认 Windows 安装体验</button>
                        <button class="priority-minimal-step" type="button"><span>最小一步：</span>在干净环境打开安装包</button>
                      </div>
                      <footer class="priority-footer">
                        <button class="preview-pause" type="button" aria-label="暂停">Ⅱ&nbsp; 暂停</button>
                        <button class="complete-button priority-complete" type="button">✓&nbsp; 今天完成</button>
                      </footer>
                    </article>
                  </div>
                </section>

                <section class="todo-grid" aria-label="事项工作区">
                  <article class="todo-column">
                    <header><h2>主线事项</h2><span>4</span></header>
                    <div class="todo-list">
                      <div class="todo-row"><div class="todo-copy has-minimal-step"><button class="todo-title" type="button">检查安装后的首屏</button><span class="todo-separator">｜</span><button class="todo-minimal-step" type="button">打开一次应用</button></div><div class="todo-actions"><button class="complete-button" type="button">✓</button></div></div>
                      <div class="todo-row"><div class="todo-copy has-minimal-step"><button class="todo-title" type="button">整理下载说明</button><span class="todo-separator">｜</span><button class="todo-minimal-step" type="button">先写三行</button></div><div class="todo-actions"><span class="todo-ongoing-count">↻ 4</span><button class="complete-button" type="button">✓</button></div></div>
                      <div class="todo-row"><div class="todo-copy has-minimal-step"><button class="todo-title" type="button">核对数据备份</button><span class="todo-separator">｜</span><button class="todo-minimal-step" type="button">导出一次数据库</button></div><div class="todo-actions"><button class="complete-button" type="button">✓</button></div></div>
                      <div class="todo-row"><div class="todo-copy has-minimal-step"><button class="todo-title" type="button">记录测试反馈</button><span class="todo-separator">｜</span><button class="todo-minimal-step" type="button">只记最卡的一步</button></div><div class="todo-actions"><button class="complete-button" type="button">✓</button></div></div>
                    </div>
                    <form class="quick-add"><input aria-label="添加主线事项" placeholder="＋ 添加事项" /><button class="todo-kind-toggle" type="button">持续</button><button type="button">添加</button></form>
                  </article>

                  <article class="todo-column state-todo-column">
                    <header><h2>其他事项</h2><span>3</span></header>
                    <div class="todo-list">
                      <div class="todo-row"><div class="todo-copy"><button class="todo-title" type="button">回复体验反馈</button></div><div class="todo-actions"><button class="complete-button" type="button">✓</button></div></div>
                      <div class="todo-row"><div class="todo-copy"><button class="todo-title" type="button">整理桌面</button></div><div class="todo-actions"><span class="todo-ongoing-count">↻ 8</span><button class="complete-button" type="button">✓</button></div></div>
                      <div class="todo-row"><div class="todo-copy has-minimal-step"><button class="todo-title" type="button">准备明天安排</button><span class="todo-separator">｜</span><button class="todo-minimal-step" type="button">先选一件事</button></div><div class="todo-actions"><button class="complete-button" type="button">✓</button></div></div>
                    </div>
                    <form class="quick-add"><input aria-label="添加其他事项" placeholder="＋ 添加事项" /><button class="todo-kind-toggle" type="button">持续</button><button type="button">添加</button></form>
                  </article>
                </section>
              </div>
            </section>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
