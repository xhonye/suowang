name: Verify SUOWANG

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-test:
    name: Core - ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24.15.0'
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24.15.0'
          - os: macos-14
            node: '22'
          - os: macos-14
            node: '24.15.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:temp

  browser-test:
    name: Browser - Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  desktop-test:
    name: Desktop - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run desktop:bootstrap
      - run: npm run test:desktop
      - name: Upload desktop failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-desktop-failure-${{ matrix.os }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/desktop/
          if-no-files-found: warn
          retention-days: 14

  package-and-public-audit:
    name: Package manifest and public surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run package:check
      - run: npm run audit:public
      - run: npm audit --omit=dev
      - run: npm run audit:build
