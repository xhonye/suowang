name: Build Windows candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to build; a final tag is not required
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and smoke Windows Setup and Portable
    runs-on: windows-latest
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Verify immutable candidate identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Candidate input must be a full lowercase 40-character commit SHA.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Checked out $actual instead of requested $env:CANDIDATE_SHA" }
          $version = node -p "require('./package.json').version"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "CANDIDATE_SHORT_SHA=$($actual.Substring(0, 12))" >> $env:GITHUB_ENV

      - run: npm ci
      - run: npm run desktop:bootstrap
      - run: npx playwright install chromium
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Run release gates and build Windows Lite and Desktop candidates
        run: npm run release:windows

      - name: Verify Lite Portable, Setup, shortcut, upgrade and data retention
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-lite-package.ps1 -VerifyShortcut

      - name: Verify assets, real entry points, upgrade and data retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PACKAGE_VERSION
          $desktopPortableRoot = Join-Path $PWD "dist/windows/SUOWANG-Desktop-Portable-$version"
          $desktopPortableZip = Join-Path $PWD "dist/windows/SUOWANG-Desktop-Portable-$version.zip"
          $desktopSetup = Join-Path $PWD "dist/windows/SUOWANG-Desktop-Setup-$version.exe"
          $litePortableRoot = Join-Path $PWD "dist/windows/SUOWANG-Lite-Portable-$version"
          $litePortableZip = Join-Path $PWD "dist/windows/SUOWANG-Lite-Portable-$version.zip"
          $liteSetup = Join-Path $PWD "dist/windows/SUOWANG-Lite-Setup-$version.exe"
          $checksums = Join-Path $PWD "dist/windows/SUOWANG-$version-Windows-SHA256SUMS.txt"
          $signingStatus = Join-Path $PWD 'dist/windows/SIGNING-STATUS.txt'
          foreach ($path in @(
            $desktopPortableRoot,
            $desktopPortableZip,
            $desktopSetup,
            $litePortableRoot,
            $litePortableZip,
            $liteSetup,
            $checksums,
            $signingStatus
          )) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release candidate: $path" }
          }
          foreach ($forbidden in @('runtime/node.exe', 'scripts/start.ps1', 'SUOWANG.cmd')) {
            if (Test-Path -LiteralPath (Join-Path $desktopPortableRoot $forbidden)) { throw "Legacy launcher leaked into Desktop Portable: $forbidden" }
          }
          foreach ($required in @('SUOWANG-Lite.exe', 'runtime/node.exe', 'scripts/start.ps1', 'scripts/serve.mjs')) {
            if (-not (Test-Path -LiteralPath (Join-Path $litePortableRoot $required) -PathType Leaf)) { throw "Lite Portable is missing: $required" }
          }
          foreach ($forbidden in @('SUOWANG.exe', 'resources/app.asar', 'chrome_100_percent.pak')) {
            if (Test-Path -LiteralPath (Join-Path $litePortableRoot $forbidden)) { throw "Desktop shell leaked into Lite Portable: $forbidden" }
          }

          $testRoot = Join-Path $env:RUNNER_TEMP "suowang-desktop-smoke-$PID"
          $desktopInstallRoot = Join-Path $testRoot 'desktop-installed'
          $portableData = Join-Path $testRoot 'portable-data'
          $installedData = Join-Path $testRoot 'installed-data'
          $shortcutData = Join-Path $testRoot 'shortcut-data'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null

          function Invoke-PackagedSmoke([string]$exe, [string]$data, [string]$name) {
            $report = Join-Path $testRoot "$name-report.json"
            $env:SUOWANG_DATA_DIR = $data
            $env:SUOWANG_SMOKE_REPORT = $report
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
            $seenChildren = @()
            while (-not $process.HasExited) {
              $seenChildren += Get-CimInstance Win32_Process -Filter "ParentProcessId=$($process.Id)" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              Start-Sleep -Milliseconds 100
              $process.Refresh()
            }
            if ($process.ExitCode -ne 0) { throw "$name smoke exited with $($process.ExitCode)" }
            if ($seenChildren | Where-Object { $_ -match '^(powershell|pwsh|cmd)\.exe$' }) { throw "$name launched a command shell." }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (
              $result.status -ne 'passed' -or
              -not $result.rendererLoaded -or
              -not $result.rendererReady -or
              -not $result.visualAssetsLoaded -or
              @($result.visualAssets).Count -ne 4 -or
              -not $result.databaseWrite
            ) { throw "$name smoke report failed." }
            if ($result.version -ne $version) { throw "$name reported version $($result.version), expected $version." }
            $remaining = @()
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              $remaining = @(Get-Process -Name SUOWANG -ErrorAction SilentlyContinue)
              if ($remaining.Count -eq 0) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($remaining.Count -gt 0) {
              throw "$name left SUOWANG processes running after bounded shutdown wait: $($remaining.Id -join ',')."
            }
          }

          try {
            $portableExe = Join-Path $desktopPortableRoot 'SUOWANG.exe'
            Invoke-PackagedSmoke $portableExe $portableData 'portable'

            $setupProcess = Start-Process -FilePath $desktopSetup -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              "/DIR=$desktopInstallRoot"
            ) -Wait -PassThru -WindowStyle Hidden
            if ($setupProcess.ExitCode -ne 0) { throw "Setup exited with $($setupProcess.ExitCode)" }
            $installedExe = Join-Path $desktopInstallRoot 'SUOWANG.exe'
            $uninstaller = Join-Path $desktopInstallRoot 'unins000.exe'
            foreach ($path in @($installedExe, $uninstaller)) {
              if (-not (Test-Path -LiteralPath $path)) { throw "Installed file missing: $path" }
            }
            foreach ($forbidden in @('runtime/node.exe', 'scripts/start.ps1', 'SUOWANG.cmd')) {
              if (Test-Path -LiteralPath (Join-Path $desktopInstallRoot $forbidden)) { throw "Legacy launcher installed: $forbidden" }
            }
            $desktop = [Environment]::GetFolderPath('Desktop')
            $shortcutPath = Join-Path $desktop '所往 SUOWANG.lnk'
            if (-not (Test-Path -LiteralPath $shortcutPath)) { throw 'Desktop shortcut was not created.' }
            Invoke-PackagedSmoke $shortcutPath $shortcutData 'desktop-shortcut'
            if ((Get-Item $portableExe).VersionInfo.ProductVersion -ne (Get-Item $installedExe).VersionInfo.ProductVersion) { throw 'Portable and installed product versions differ.' }

            node scripts/create-upgrade-fixture.mjs $installedData
            Invoke-PackagedSmoke $installedExe $installedData 'installed-upgrade'
            node scripts/verify-upgrade-fixture.mjs $installedData

            $env:SUOWANG_DATA_DIR = Join-Path $testRoot 'single-instance-data'
            $first = Start-Process -FilePath $installedExe -PassThru -WindowStyle Hidden
            $lock = Join-Path $env:SUOWANG_DATA_DIR 'instance.lock'
            for ($i = 0; $i -lt 100 -and -not (Test-Path -LiteralPath $lock); $i++) { Start-Sleep -Milliseconds 100 }
          if (-not (Test-Path -LiteralPath $lock)) { throw 'Desktop instance lock did not appear.' }
          $owner = (Get-Content -LiteralPath $lock -Raw | ConvertFrom-Json).pid
          $ownerProcess = Get-Process -Id $owner -ErrorAction Stop
          $second = Start-Process -FilePath $installedExe -PassThru -WindowStyle Hidden
          if (-not $second.WaitForExit(10000)) { throw 'Second desktop instance did not exit.' }
          if ((Get-Content -LiteralPath $lock -Raw | ConvertFrom-Json).pid -ne $owner) { throw 'Second launch replaced the database owner.' }
          for ($i = 0; $i -lt 100 -and -not $ownerProcess.HasExited -and $ownerProcess.MainWindowHandle -eq 0; $i++) {
            Start-Sleep -Milliseconds 100
            $ownerProcess.Refresh()
          }
          if ($ownerProcess.HasExited -or $ownerProcess.MainWindowHandle -eq 0) { throw 'SUOWANG owner process did not expose its desktop window.' }
          if (-not $ownerProcess.CloseMainWindow()) { throw 'SUOWANG window did not accept a normal close request.' }
          if (-not $ownerProcess.WaitForExit(15000)) { throw 'SUOWANG did not exit after its window closed.' }
          if (Test-Path -LiteralPath $lock) { throw 'Instance lock remained after graceful exit.' }

            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART'
            ) -Wait -PassThru -WindowStyle Hidden
            if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstallProcess.ExitCode)" }
            if (-not (Test-Path -LiteralPath (Join-Path $installedData 'suowang.db'))) { throw 'User database did not survive uninstall.' }
            node scripts/verify-upgrade-fixture.mjs $installedData
          } finally {
            Get-Process -Name SUOWANG -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item Env:SUOWANG_DATA_DIR -ErrorAction SilentlyContinue
            Remove-Item Env:SUOWANG_SMOKE_REPORT -ErrorAction SilentlyContinue
            if ([System.IO.Path]::GetFullPath($testRoot).StartsWith([System.IO.Path]::GetFullPath($env:RUNNER_TEMP))) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload immutable Windows candidate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SUOWANG-Windows-${{ env.PACKAGE_VERSION }}-${{ env.CANDIDATE_SHORT_SHA }}
          path: |
            dist/windows/SUOWANG-Lite-Portable-${{ env.PACKAGE_VERSION }}.zip
            dist/windows/SUOWANG-Lite-Setup-${{ env.PACKAGE_VERSION }}.exe
            dist/windows/SUOWANG-Desktop-Portable-${{ env.PACKAGE_VERSION }}.zip
            dist/windows/SUOWANG-Desktop-Setup-${{ env.PACKAGE_VERSION }}.exe
            dist/windows/SUOWANG-${{ env.PACKAGE_VERSION }}-Windows-SHA256SUMS.txt
            dist/windows/SIGNING-STATUS.txt
          if-no-files-found: error
          retention-days: 14
