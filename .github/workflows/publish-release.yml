name: Publish verified candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Audited full 40-character commit SHA used by both candidate builds
        required: true
        type: string
      windows_run_id:
        description: Successful Build Windows candidate run ID for this SHA
        required: true
        type: string
      core_ci_run_id:
        description: Successful Verify SUOWANG main CI run ID for this SHA
        required: true
        type: string
      macos_run_id:
        description: Successful Build macOS Apple Silicon candidate run ID for this SHA
        required: true
        type: string
      install_evidence:
        description: Reference to completed Windows/macOS installation and upgrade evidence
        required: true
        type: string
      confirmation:
        description: Type INSTALL_VERIFIED to create the final tag and publish the immutable Release
        required: true
        type: string

concurrency:
  group: publish-suowang-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify candidates, create tag, stage assets and publish once
    runs-on: ubuntu-latest
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'

      - name: Verify approval, SHA and candidate run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          CORE_CI_RUN_ID: ${{ inputs.core_ci_run_id }}
          INSTALL_EVIDENCE: ${{ inputs.install_evidence }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'INSTALL_VERIFIED'
          [[ "$INSTALL_EVIDENCE" =~ [^[:space:]] ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          short_sha="${CANDIDATE_SHA:0:12}"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

          verify_run() {
            local run_id="$1" kind="$2"
            [[ "$run_id" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/$kind-run.json"
            node scripts/release-provenance.mjs "$kind" "$RUNNER_TEMP/$kind-run.json"
          }
          verify_run "$CORE_CI_RUN_ID" core
          verify_run "$WINDOWS_RUN_ID" windows
          verify_run "$MACOS_RUN_ID" macos

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing Release $tag" >&2
            exit 1
          fi

      - name: Download exact candidate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidates/windows candidates/macos
          gh run download "$WINDOWS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "SUOWANG-Windows-${PACKAGE_VERSION}-${CANDIDATE_SHORT_SHA}" \
            --dir candidates/windows
          gh run download "$MACOS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "SUOWANG-macos-arm64-${PACKAGE_VERSION}-${CANDIDATE_SHORT_SHA}" \
            --dir candidates/macos

      - name: Verify complete immutable asset set
        shell: bash
        run: |
          set -euo pipefail
          windows_files=(
            "SUOWANG-Lite-Portable-${PACKAGE_VERSION}.zip"
            "SUOWANG-Lite-Setup-${PACKAGE_VERSION}.exe"
            "SUOWANG-Desktop-Portable-${PACKAGE_VERSION}.zip"
            "SUOWANG-Desktop-Setup-${PACKAGE_VERSION}.exe"
            "SUOWANG-${PACKAGE_VERSION}-Windows-SHA256SUMS.txt"
          )
          macos_files=(
            "SUOWANG-${PACKAGE_VERSION}-mac-arm64.dmg"
            "SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt"
          )
          for file in "${windows_files[@]}"; do test -f "candidates/windows/$file"; done
          for file in "${macos_files[@]}"; do test -f "candidates/macos/$file"; done
          test -f candidates/windows/SIGNING-STATUS.txt
          test -f candidates/macos/SIGNING-STATUS.txt
          test "$(find candidates -type f | wc -l | tr -d ' ')" = 9
          (cd candidates/windows && sha256sum --check "SUOWANG-${PACKAGE_VERSION}-Windows-SHA256SUMS.txt")
          (cd candidates/macos && sha256sum --check "SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt")

          windows_signing="$(tr -d '\r\n' < candidates/windows/SIGNING-STATUS.txt)"
          macos_signing="$(tr -d '\r\n' < candidates/macos/SIGNING-STATUS.txt)"
          [[ "$windows_signing" =~ ^(SIGNED|UNSIGNED)$ ]]
          [[ "$macos_signing" =~ ^(SIGNED\+NOTARIZED|SIGNED|UNSIGNED)$ ]]
          electron_version="$(node -p "require('./package.json').devDependencies.electron")"
          echo "ELECTRON_VERSION=$electron_version" >> "$GITHUB_ENV"
          echo "WINDOWS_SIGNING_STATUS=$windows_signing" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_STATUS=$macos_signing" >> "$GITHUB_ENV"

      - name: Create cross-platform mirror manifest
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          node scripts/create-mirror-manifest.mjs \
            --version "$PACKAGE_VERSION" \
            --sha "$CANDIDATE_SHA" \
            --electron "$ELECTRON_VERSION" \
            --windows-signing "$WINDOWS_SIGNING_STATUS" \
            --macos-signing "$MACOS_SIGNING_STATUS" \
            --windows-dir candidates/windows \
            --macos-dir candidates/macos \
            --output "candidates/SUOWANG-${PACKAGE_VERSION}-MIRROR-MANIFEST.txt"

      - name: Create immutable tag and draft Release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$RELEASE_TAG" "$CANDIDATE_SHA" --message "SUOWANG $PACKAGE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "candidates/windows/SUOWANG-Lite-Portable-${PACKAGE_VERSION}.zip" \
            "candidates/windows/SUOWANG-Lite-Setup-${PACKAGE_VERSION}.exe" \
            "candidates/windows/SUOWANG-Desktop-Portable-${PACKAGE_VERSION}.zip" \
            "candidates/windows/SUOWANG-Desktop-Setup-${PACKAGE_VERSION}.exe" \
            "candidates/windows/SUOWANG-${PACKAGE_VERSION}-Windows-SHA256SUMS.txt" \
            "candidates/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64.dmg" \
            "candidates/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt" \
            "candidates/SUOWANG-${PACKAGE_VERSION}-MIRROR-MANIFEST.txt" \
            --draft --prerelease --verify-tag \
            --title "SUOWANG $PACKAGE_VERSION" \
            --notes-file "docs/releases/v${PACKAGE_VERSION}.md"

      - name: Verify draft completeness, then publish once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_EVIDENCE: ${{ inputs.install_evidence }}
        run: |
          set -euo pipefail
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")"
          case "$release_id" in
            ''|*[!0-9]*) echo "Expected exactly one numeric draft Release ID for $RELEASE_TAG" >&2; exit 1 ;;
          esac
          release_endpoint="repos/$GITHUB_REPOSITORY/releases/$release_id"
          test "$(gh api "$release_endpoint" --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api "$release_endpoint" --jq .draft)" = true
          actual="$(gh api "$release_endpoint" --jq '[.assets[].name] | sort | join("\n")')"
          expected="$(printf '%s\n' \
            "SUOWANG-${PACKAGE_VERSION}-Windows-SHA256SUMS.txt" \
            "SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt" \
            "SUOWANG-${PACKAGE_VERSION}-mac-arm64.dmg" \
            "SUOWANG-${PACKAGE_VERSION}-MIRROR-MANIFEST.txt" \
            "SUOWANG-Lite-Portable-${PACKAGE_VERSION}.zip" \
            "SUOWANG-Lite-Setup-${PACKAGE_VERSION}.exe" \
            "SUOWANG-Desktop-Portable-${PACKAGE_VERSION}.zip" \
            "SUOWANG-Desktop-Setup-${PACKAGE_VERSION}.exe" | sort)"
          test "$actual" = "$expected"
          # Verify uploaded bytes too: names alone cannot prove a complete, identical upload.
          mkdir -p "$RUNNER_TEMP/release-verification"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-verification"
          while IFS= read -r filename; do
            candidate="$(find candidates -type f -name "$filename")"
            test -f "$candidate"
            cmp -- "$candidate" "$RUNNER_TEMP/release-verification/$filename"
          done <<< "$expected"
          printf 'Install evidence: %s\n' "$INSTALL_EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
          gh api --method PATCH "$release_endpoint" -F draft=false -F prerelease=true >/dev/null
