name: Build macOS Apple Silicon candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to build; a final tag is not required
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build, mount and launch macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Verify immutable candidate identity and Apple Silicon runner
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          version="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHORT_SHA=${actual:0:12}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx playwright install chromium

      - name: Run release gates and build unsigned Apple Silicon candidate
        run: npm run release:macos

      - name: Verify, mount, copy and launch final DMG
        shell: bash
        run: |
          dmg="dist/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64.dmg"
          checksums="dist/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt"
          test -f "$dmg"
          test -f "$checksums"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/suowang-dmg.XXXXXX")"
          install_dir="$(mktemp -d "$RUNNER_TEMP/suowang-applications.XXXXXX")"
          data_dir="$(mktemp -d "$RUNNER_TEMP/suowang-data.XXXXXX")"
          mounted='false'
          cleanup() {
            if [[ "$mounted" == 'true' ]]; then hdiutil detach "$mount_dir" -quiet || true; fi
            rm -rf "$mount_dir" "$install_dir" "$data_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          mounted='true'
          cp -R "$mount_dir/所往 SUOWANG.app" "$install_dir/"
          app_root="$install_dir/所往 SUOWANG.app"
          plutil -lint "$app_root/Contents/Info.plist"
          test -x "$app_root/Contents/MacOS/SUOWANG"
          test -x "$app_root/Contents/Resources/app/runtime/bin/node"
          "$app_root/Contents/Resources/app/runtime/bin/node" -e "import('$app_root/Contents/Resources/app/node_modules/better-sqlite3/lib/index.js').then(() => console.log('packaged better-sqlite3 OK'))"

          port="$(python3 - <<'PY'
          import socket
          sock = socket.socket()
          sock.bind(('127.0.0.1', 0))
          print(sock.getsockname()[1])
          sock.close()
          PY
          )"
          export SUOWANG_DATA_DIR="$data_dir"
          export SUOWANG_PORT="$port"
          export SUOWANG_SKIP_BROWSER=1
          "$app_root/Contents/MacOS/SUOWANG"
          health="$(curl --fail --silent "http://127.0.0.1:$port/health")"
          pid="$("$app_root/Contents/Resources/app/runtime/bin/node" -e 'const h=JSON.parse(process.argv[1]); if(h.app!=="suowang"||h.version!==process.argv[2]||h.database!=="ready") process.exit(1); process.stdout.write(String(h.pid));' "$health" "$PACKAGE_VERSION")"
          kill -TERM "$pid"
          for _ in {1..50}; do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo 'Packaged SUOWANG service did not stop cleanly.' >&2
            exit 1
          fi

      - name: Upload immutable macOS candidate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SUOWANG-macos-arm64-${{ env.PACKAGE_VERSION }}-${{ env.CANDIDATE_SHORT_SHA }}
          path: |
            dist/macos/SUOWANG-${{ env.PACKAGE_VERSION }}-mac-arm64.dmg
            dist/macos/SUOWANG-${{ env.PACKAGE_VERSION }}-mac-arm64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
