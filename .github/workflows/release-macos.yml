name: Build macOS Apple Silicon release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7

      - name: Set up the bundled Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install production dependency tree for Apple Silicon
        run: npm ci --omit=dev

      - name: Verify source and build DMG
        run: npm run release:macos

      - name: Keep a reviewable DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: SUOWANG-macos-arm64-${{ github.sha }}
          path: |
            dist/macos/*.dmg
            dist/macos/*SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach DMG to the published Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/macos/*.dmg dist/macos/*SHA256SUMS.txt --clobber
