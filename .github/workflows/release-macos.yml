name: Build macOS Apple Silicon candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to build; a final tag is not required
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build, mount and smoke macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Verify immutable candidate identity and runner
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          version="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHORT_SHA=${actual:0:12}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run desktop:bootstrap
      - run: npx playwright install chromium
      - name: Run release gates and build macOS desktop candidate
        run: npm run release:macos
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Mount, copy and smoke the final DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64.dmg"
          checksums="dist/macos/SUOWANG-${PACKAGE_VERSION}-mac-arm64-SHA256SUMS.txt"
          signing_status="dist/macos/SIGNING-STATUS.txt"
          test -f "$dmg"
          test -f "$checksums"
          test -f "$signing_status"
          (cd dist/macos && shasum -a 256 -c "$(basename "$checksums")")

          mount_dir="$(mktemp -d "$RUNNER_TEMP/suowang-dmg.XXXXXX")"
          applications_dir="$(mktemp -d "$RUNNER_TEMP/suowang-applications.XXXXXX")"
          data_dir="$(mktemp -d "$RUNNER_TEMP/suowang-upgrade.XXXXXX")"
          report="$RUNNER_TEMP/suowang-macos-smoke.json"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$mount_dir" -quiet || true; fi
            rm -rf "$mount_dir" "$applications_dir" "$data_dir" "$report"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          mounted=true
          test -L "$mount_dir/Applications"
          cp -R "$mount_dir/所往 SUOWANG.app" "$applications_dir/"
          app_root="$applications_dir/所往 SUOWANG.app"
          executable="$app_root/Contents/MacOS/SUOWANG"
          plutil -lint "$app_root/Contents/Info.plist"
          test -x "$executable"
          test ! -e "$app_root/Contents/Resources/app/runtime/bin/node"
          test ! -e "$app_root/Contents/Resources/app/scripts/start.ps1"

          node scripts/create-upgrade-fixture.mjs "$data_dir"
          SUOWANG_DATA_DIR="$data_dir" SUOWANG_SMOKE_REPORT="$report" "$executable" --smoke-test
          node -e "const r=require('$report'); if(r.status!=='passed'||!r.rendererLoaded||!r.databaseWrite) process.exit(1)"
          node scripts/verify-upgrade-fixture.mjs "$data_dir"
          if pgrep -f "$executable" >/dev/null; then
            echo 'macOS packaged smoke left a process running.' >&2
            exit 1
          fi

      - name: Upload immutable macOS candidate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SUOWANG-macos-arm64-${{ env.PACKAGE_VERSION }}-${{ env.CANDIDATE_SHORT_SHA }}
          path: |
            dist/macos/SUOWANG-${{ env.PACKAGE_VERSION }}-mac-arm64.dmg
            dist/macos/SUOWANG-${{ env.PACKAGE_VERSION }}-mac-arm64-SHA256SUMS.txt
            dist/macos/SIGNING-STATUS.txt
          if-no-files-found: error
          retention-days: 14
