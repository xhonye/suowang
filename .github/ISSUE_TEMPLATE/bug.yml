name: Bug 报告
description: 报告可以稳定复现的错误或安装失败。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传数据库、备份、私人事项、Token 或未脱敏截图。先确认问题来自 GitHub Release 的正式资产。
  - type: input
    id: version
    attributes:
      label: SUOWANG 版本
      description: 例如 0.2.0-beta.1，可在 /health 或安装文件名中确认。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台与入口
      options:
        - Windows Setup.exe
        - Windows Portable.zip
        - macOS Apple Silicon DMG
        - 源码 / npm
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开哪个文件开始，按顺序写出最少步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误信息
      description: 可粘贴错误窗口或日志中的报错；请先遮掉用户名和个人路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有上传数据库、备份、私人事项、Token 或未脱敏截图。
          required: true
